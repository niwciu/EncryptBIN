name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        default: 'v0.1.0'

jobs:
  resolve_version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}

    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi

          VERSION="${TAG_NAME#v}"

          echo "Resolved TAG: $TAG_NAME"
          echo "Resolved VERSION: $VERSION"

          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT


  test:
    needs: resolve_version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl-mesa0 \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libxrender1 \
            libxext6 \
            libxrandr2 \
            libxi6 \
            libfontconfig1 \
            libxcb-glx0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxkbcommon0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[gui,dev]"

      - name: Lint with ruff
        run: |
          .venv/bin/ruff check src/ tests/

      - name: Lint with flake8
        run: |
          .venv/bin/flake8 src tests

      - name: Type check with mypy
        run: |
          .venv/bin/mypy src

      - name: Format check with black
        run: |
          .venv/bin/black --check src tests

      - name: Security scan with bandit
        run: |
          .venv/bin/bandit -r src/ -ll -x src/encrypt_bin/gui/resources

      - name: Dependency vulnerability scan
        run: |
          .venv/bin/pip-audit --skip-editable

      - name: Run tests
        run: |
          .venv/bin/pytest --cov=src/encrypt_bin --cov-fail-under=90 tests/
        env:
          QT_QPA_PLATFORM: offscreen


  build_ubuntu:
    needs: [resolve_version, test]
    runs-on: ubuntu-latest
    env:
      APP_NAME: EncryptBIN
      VERSION: ${{ needs.resolve_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[gui,build]"
          pyinstaller --onefile --windowed --name "$APP_NAME" --paths="src" \
            --add-data "src/encrypt_bin/gui/resources:resources" \
            --add-data "src/encrypt_bin/gui/LICENSE:." \
            src/encrypt_bin/gui/main.py
          chmod +x "dist/$APP_NAME"

      - name: Package
        run: |
          mkdir -p release

          tar -czf "release/${APP_NAME}-linux-binary.tar.gz" -C dist "$APP_NAME"

          PKG_ROOT="pkg-root"
          INSTALL_ROOT="/opt/${APP_NAME}"

          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT${INSTALL_ROOT}"
          mkdir -p "$PKG_ROOT/usr/share/applications"
          mkdir -p "$PKG_ROOT/usr/share/pixmaps"
          mkdir -p "$PKG_ROOT/usr/local/bin"

          cp "dist/$APP_NAME" "$PKG_ROOT${INSTALL_ROOT}/$APP_NAME"
          cp "src/encrypt_bin/gui/resources/icons/icon.png" "$PKG_ROOT/usr/share/pixmaps/${APP_NAME}.png"

          cat > "$PKG_ROOT/usr/share/applications/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Exec=${INSTALL_ROOT}/${APP_NAME}
          Icon=${APP_NAME}
          Terminal=false
          Categories=Utility;
          EOF

          ln -s "${INSTALL_ROOT}/${APP_NAME}" "$PKG_ROOT/usr/local/bin/$APP_NAME"

          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: encryptbin
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: niwciu <niwciu@gmail.com>
          Description: EncryptBIN desktop application
          EOF

          dpkg-deb --build "$PKG_ROOT" "release/${APP_NAME}-linux-installer.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-build
          path: release/*


  build_windows:
    needs: [resolve_version, test]
    runs-on: windows-latest
    env:
      APP_NAME: EncryptBIN
      VERSION: ${{ needs.resolve_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e ".[gui,build]"

          .venv\Scripts\pyinstaller `
            --onefile `
            --noconsole `
            --name "${env:APP_NAME}" `
            --paths="src" `
            --icon="src/encrypt_bin/gui/resources/icons/icon.ico" `
            --add-data "src/encrypt_bin/gui/resources;resources" `
            --add-data "src/encrypt_bin/gui/LICENSE;." `
            src/encrypt_bin/gui/main.py

      - name: Package
        run: |
          mkdir release

          Compress-Archive -Path "dist\${env:APP_NAME}.exe" -DestinationPath "release\${env:APP_NAME}-windows-binary.zip"

          @"
          [Setup]
          AppId={{0D0C7732-4D5F-41E4-B7A1-2F5D44E3D0A1}
          AppName=${env:APP_NAME}
          AppVersion=${env:VERSION}
          DefaultDirName={autopf}\${env:APP_NAME}
          DefaultGroupName=${env:APP_NAME}
          OutputDir=release
          OutputBaseFilename=${env:APP_NAME}-windows-setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "dist\${env:APP_NAME}.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\encrypt_bin\gui\resources\icons\icon.ico"; DestDir: "{app}"; Flags: ignoreversion
          "@ | Set-Content installer.iss

          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release\*


  release:
    needs: [resolve_version, build_ubuntu, build_windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Extract changelog
        id: changelog
        run: |
          TAG_NAME="${{ needs.resolve_version.outputs.tag }}"

          if ! grep -q "## $TAG_NAME" CHANGELOG.md; then
            echo "ERROR: version not found in CHANGELOG"
            exit 1
          fi

          CONTENT=$(awk -v tag="$TAG_NAME" '
            BEGIN { found=0; gsub(/\./, "\\.", tag) }
            $0 ~ ("^## +" tag) {
              found=1
              next
            }
            found && $0 ~ "^## +v[0-9]+\\.[0-9]+\\.[0-9]+" {
              exit
            }
            found { print }
          ' CHANGELOG.md)

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-build
          path: dist/linux/

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows/

      - name: Create archives
        run: |
          mkdir final

          tar -czf final/EncryptBIN-linux.tar.gz -C dist/linux .
          cd dist/windows
          zip -r ../../final/EncryptBIN-windows.zip .
          cd -

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve_version.outputs.tag }}
          name: ${{ needs.resolve_version.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            final/EncryptBIN-linux.tar.gz
            final/EncryptBIN-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
