site_name: encrypt-bin
site_description: AES-128-CBC encrypted firmware binary generator for embedded devices
site_url: https://niwciu.github.io/encrypt-bin/

repo_url: https://github.com/niwciu/encrypt-bin
repo_name: niwciu/encrypt-bin

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list

plugins:
  - search

nav:
  - Overview: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Configuration File: config_file.md
  - Key File: key_file.md
  - Output Format: output_format.md
  - Release Signing: release_signing.md
  - Contributing: contributing.md
  - Troubleshooting: troubleshooting.md
